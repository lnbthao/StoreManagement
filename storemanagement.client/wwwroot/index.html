<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý kho hàng</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); text-align:center;">
            <p style="font-size:2rem;">🔄</p>
            <p>Đang tải...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Đã xảy ra lỗi không mong muốn. Vui lòng tải lại trang.
        <a href="" class="reload">Tải lại</a>
        <a class="dismiss">🗙</a>
    </div>
    
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        // Helper function để submit form MoMo
        window.submitMomoForm = function(orderId, amount, fullName, orderInfo) {
            const form = document.createElement("form");
            form.method = "POST";
            form.action = "/api/payment/CreatePaymentMomo";
            form.acceptCharset = "UTF-8";
            
            const fields = {
                OrderId: orderId,
                Amount: amount,
                FullName: fullName,
                OrderInfo: orderInfo
            };
            
            Object.entries(fields).forEach(([name, value]) => {
                const input = document.createElement("input");
                input.type = "hidden";
                input.name = name;
                input.value = String(value ?? "");
                form.appendChild(input);
            });
            
            document.body.appendChild(form);
            form.submit();
        };
    </script>
</body>

</html>
